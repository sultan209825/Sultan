<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SULTAN</title>

<!-- أيقونات الموقع -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2326d9ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='bold' font-size='30' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

<meta name="description" content="3 ثانوي 📖 + GYM 🦾">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SULTAN">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="SULTAN">
<meta property="og:description" content="3 ثانوي 📖 + GYM 🦾">
<meta property="og:image" content="https://sultan.kesug.com/og-image.png">
<meta property="og:image:secure_url" content="https://sultan.kesug.com/og-image.png">

<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">

<meta name="theme-color" content="#7c5cff">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SULTAN">
<meta name="twitter:description" content="3 ثانوي 📖 + GYM 🦾">
<meta name="twitter:image" content="https://sultan.kesug.com/og-image.png">

<!-- ربط ملف التصميم (CSS) -->
<link rel="stylesheet" href="style.css?v=20260921-2">
</head>
<body>

<div id="introLoader">
  <div class="intro-pulse">S</div>
</div>

<div id="enterOverlay">
  <div class="enter-inner">
    <div class="enter-avatar">S</div>
    <div class="enter-title">SULTAN</div>
    <div class="enter-sub"><span class="pulse-dot"></span> اضغط في أي مكان للدخول 🔊</div>
  </div>
</div>

<!-- قائمة كليك يمين مخصصة -->
<div id="customContextMenu" class="context-menu">
  <button type="button" data-action="share">📤 مشاركة الصفحة</button>
  <button type="button" data-action="copy">📋 نسخ الرابط</button>
  <div class="ctx-sep"></div>
  <button type="button" data-action="discord">💬 زوري حسابي بديسكورد</button>
  <button type="button" data-action="surprise">👑 مفاجأة</button>
</div>

<!-- لعبة مخفية -->
<div id="gameModal" class="game-modal">
  <div class="game-box">
    <button class="game-close" id="gameClose" type="button">✕</button>
    <div class="game-score">النقاط: <b id="gameScore">0</b> &nbsp;•&nbsp; 🏆 أعلى نقاطك: <b id="gameHighScore">0</b></div>
    <canvas id="gameCanvas" width="320" height="160"></canvas>
    <div class="game-hint" id="gameHint">اضغطي مسافة أو دوسي على الشاشة للقفز</div>
  </div>
</div>

<!-- الخلفيات والمؤثرات -->
<div id="bg-canvas"></div>
<div id="bg-noise"></div>
<div id="bg-vignette"></div>
<canvas id="particles" style="position:fixed;inset:0;z-index:1;"></canvas>
<div id="cursor-glow"></div>
<div id="cursor-dot"></div>

<div class="wrap">
  <div class="card-tilt" id="cardTilt">
  <div class="card">
    <div class="top-glow"></div>
    <div class="banner"></div>

    <div class="avatar-zone">
      <div class="ring"></div>
      <div class="ring delay"></div>
      <div class="avatar loading" id="avatar">
        <img id="avatarImg" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:50%;">
        <span id="avatarFallback">S</span>
      </div>
      <div class="status-dot" id="statusDot" title="جارِ الاتصال..."></div>
    </div>

    <div class="identity">
      <div class="username loading">
        <span id="usernameText">SEVN</span>
        <span class="badge" title="موثّق">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 1l2.5 2.2 3.3-.4 1 3.2 3.2 1-1.7 2.9 1.7 3-3.2 1-1 3.2-3.3-.4L10 19l-2.5-2.3-3.3.4-1-3.2-3.2-1 1.7-3-1.7-2.9 3.2-1 1-3.2 3.3.4L10 1z" fill="#7c5cff"/><path d="M6.7 10.2l2.1 2.1 4.4-4.6" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <div class="handle-row">
        <div class="handle loading" id="handleText">@sevn</div>
        <div class="copy-btn" id="copyDiscordBtn" title="نسخ يوزر الديسكورد">
          <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <svg id="checkIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none;"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <button class="copy-btn" id="shareBtn" type="button" title="مشاركة الصفحة">
          <svg id="shareIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
          <svg id="shareCheckIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none;"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </div>
    </div>

    <div class="bio" id="typedBio"></div>

    <div class="discord-activity" id="discordActivity" style="display:none;"></div>

    <div class="stats">
      <span><b id="viewCount">0</b> مشاهدة</span>
      <span class="dot-sep">•</span>
      <span>انضم <b id="joinYearText">2024</b></span>
      <span class="dot-sep">•</span>
      <span id="statsStatus" style="color:#8a89a3;">● جارِ الاتصال</span>
    </div>

    <div class="rate-row" id="rateRow">
      <span id="rateText">شكلك عجبك الموقع؟</span>
      <button type="button" id="rateUp" title="عجبني">👍</button>
      <button type="button" id="rateDown" title="ما عجبني">👎</button>
    </div>

    <div class="countdown-row" id="countdownRow" style="display:none;">⏳ <span id="countdownLabel"></span> <b id="countdownValue"></b></div>

    <div class="socials" id="socialsContainer"></div>

    <div class="music-player" id="musicPlayer">
      <div class="mp-art" id="mpArt">
        <span class="mute-badge" id="muteBadge" title="الصوت مكتوم">🔇</span>
      </div>
      <div class="mp-info">
        <div class="mp-title-row">
          <div class="mp-title" id="mpTitle">After Hours</div>
          <div class="eq-bars" id="eqBars"><span></span><span></span><span></span></div>
        </div>
        <div class="mp-artist" id="mpArtist">The Weeknd</div>
        <div class="mp-progress-track" id="mpTrack">
          <div class="mp-progress-fill" id="mpFill"></div>
        </div>
      </div>
      <div class="mp-controls">
        <button class="mp-nav" id="mpPrev" title="السابقة">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="mp-play" id="mpPlay" title="تشغيل/إيقاف">
          <svg id="mpIconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="mpIconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="mp-nav" id="mpNext" title="التالية">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
        </button>
      </div>
    </div>

    <div class="volume-row">
      <button class="vol-btn" id="volBtn" title="كتم/تشغيل الصوت">
        <svg id="volIconOn" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9v6h4l5 5V4L9 9H5z"/><path d="M16.5 12a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>
        <svg id="volIconMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M5 9v6h4l5 5V4L9 9H5z" fill="currentColor" stroke="none"/><path d="M19 8l-4 4m0-4l4 4" stroke-linecap="round"/></svg>
      </button>
      <input type="range" id="volSlider" class="vol-slider" min="0" max="100" value="50" title="مستوى الصوت">
      <span class="vol-time" id="mpTime">0:00 / 0:00</span>
      <button class="vol-btn" id="mpQueueBtn" title="قائمة التشغيل">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
      </button>
    </div>

    <div class="mp-queue-panel" id="mpQueuePanel">
      <div class="mp-queue-header">
        <span>قائمة التشغيل</span>
        <div class="mp-queue-actions">
          <button type="button" class="mp-queue-toggle" id="mpShuffle" title="تشغيل عشوائي">🔀</button>
          <button type="button" class="mp-queue-toggle" id="mpRepeat" title="تكرار الأغنية الحالية">🔁</button>
        </div>
      </div>
      <div id="mpQueueList"></div>
    </div>

    <div class="divider"></div>

    <div class="footer-row">
      <span class="footer-mark">S</span>
      <span id="footerDomainText">sultan.kesug.com</span>
    </div>
    <div class="last-updated" id="lastUpdatedRow" style="display:none;"></div>
  </div>
  </div>
</div>

<!-- تم حذف كلمة loop من السطر ده عشان الأغنية تعرف تقلب -->
<audio id="bgAudio" src="bg-music.mp3" preload="auto"></audio>

<!-- ربط ملف الجافاسكريبت (JS) -->
<script src="script.js?v=20260921-2"></script>

</body>
</html>
